<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AIinterviewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" href="https://github.com/FishosYu/FishosYu.github.io/blob/main/assets/images/products/AInterviewer.png" type="image/png">
<style>
:root {
    --bg: #ffffff;
    --gray: #f6f6f8;
    --text: #1a1a1a;
    --subtext: #666;
    --purple: #6c4cff;
}

/* ---------- Reset ---------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
}

/* ---------- Animations ---------- */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- Hero ---------- */
.hero {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: linear-gradient(
        160deg,
        rgba(108,76,255,0.08),
        rgba(255,255,255,0)
    );
}

.hero-content {
    animation: fadeUp 1s ease forwards;
}

.hero img {
    width: 96px;
    height: 96px;
    border-radius: 20px;
    margin-bottom: 1.5rem;
    box-shadow: 0 20px 40px rgba(108,76,255,0.25);
}

.hero h1 {
    font-size: 2.8rem;
    font-weight: 600;
}

.hero p {
    max-width: 520px;
    margin: 1.5rem auto 0;
    color: var(--subtext);
}

/* ---------- Section ---------- */
.section {
    padding: 5rem 1.5rem;
    max-width: 1000px;
    margin: auto;
}

.section.gray {
    background: var(--gray);
    max-width: none;
}

.section h2 {
    text-align: center;
    margin-bottom: 3rem;
    font-weight: 600;
}

/* ---------- Buttons ---------- */
.btn {
    display: inline-block;
    padding: 0.75rem 2rem;
    background: var(--purple);
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(108,76,255,0.35);
}

.btn.outline {
    background: none;
    border: 1px solid var(--purple);
    color: var(--purple);
}

.button-group {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
}

/* ---------- Cards ---------- */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2rem;
}

.card {
    background: #fff;
    padding: 2.5rem 2rem;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    text-align: center;
    animation: fadeUp 0.8s ease forwards;
}

.card h3 {
    margin-bottom: 1rem;
}

.card p {
    color: var(--subtext);
}

/* ---------- Footer ---------- */
footer {
    padding: 3rem;
    text-align: center;
    color: var(--subtext);
}
</style>
</head>

<body>

<!-- ================= Hero ================= -->
<section class="hero">
    <div class="hero-content">
        <img src="assets/logo.png" alt="AIinterviewer logo">
        <h1>AIinterviewer</h1>
        <p>
            一个基于 AI 的智能面试模拟工具，
            帮助你在真实面试前做好充分准备。
        </p>
    </div>
</section>

<!-- ================= Intro ================= -->
<section class="section">
    <h2>Product Introduction</h2>

    <p style="max-width:720px;margin:0 auto;text-align:center;color:var(--subtext);">
        AIinterviewer 通过分析你的简历与岗位需求，
        动态生成个性化面试问题，并提供实时反馈，
        让你在安全环境中不断优化面试表现。
    </p>
</section>

<!-- ================= Docs ================= -->
<section class="section gray">
    <h2>Documentation</h2>

    <div class="button-group">
        <a href="assets/AInterviewer/AInterviewer_User_Manual.pdf" class="btn">使用文档</a>
    </div>
</section>

<!-- ================= Download ================= -->
<section class="section">
    <h2>Download</h2>

    <div class="card-grid">
        <div class="card">
            <h3>Android APK</h3>
            <p>
                适用于 Android 设备的完整版本，
                支持离线使用与本地数据存储。
            </p>
            <br>
            <a href="assets/AInterviewer/ainterviewer.apk.1.1" class="btn">下载 APK</a>
        </div>
    </div>
</section>

<footer>
    <p>
        <a href="/" style="color:inherit;text-decoration:none;">
            ← 返回主页
        </a>
    </p>
    <p>© 2026 AIinterviewer</p>
</footer>

</body>
</html>
